[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-sticker-color-bot"
version = "1.0.0"
description = "Emoji & Sticker Color Bot — privacy-first Telegram sticker recoloring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiofiles==25.1.0",
    "aiosqlite==0.22.1",
    "emoji==2.15.0",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.5.2",
    "Pillow==12.3.0",
    "psutil==7.2.2",
    "pydantic-settings==2.15.0",
    "python-slugify==8.0.4",
    "regex==2026.7.19",
]

[project.scripts]
emoji-sticker-color-bot = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "ASYNC109", "ASYNC240", "UP036", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["emoji", "imageio_ffmpeg", "slugify"]
ignore_missing_imports = true
